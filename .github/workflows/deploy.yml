name: Deploy Mentor TPA Onboarding

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mentor-tpa-onboarding
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/tech823/mentor-tpa-onboarding-api
  WEB_IMAGE: ghcr.io/tech823/mentor-tpa-onboarding-web
  AWS_REGION: us-east-1
  INSTANCE_ID: i-0b314562fff771a97
  AWS_ROLE_ARN: arn:aws:iam::461958694198:role/github-oidc-mentor-tpa-onboarding-deploy
  APP_DIR: /opt/mentor-tpa-onboarding

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:latest

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://enrollapi.mentortpa.com/api
          tags: ${{ env.WEB_IMAGE }}:latest

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          set -euo pipefail
          PARAMS=$(jq -cn --arg dir "$APP_DIR" '{commands: [
            "set -e",
            ("cd " + $dir),
            "docker compose -f docker-compose.prod.yml pull",
            "docker compose -f docker-compose.prod.yml up -d --force-recreate",
            "docker image prune -f"
          ]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy mentor-tpa-onboarding ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command id: $CMD_ID"
          STATUS=Pending
          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "Status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          echo "---- stdout ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "---- stderr ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          [ "$STATUS" = "Success" ]