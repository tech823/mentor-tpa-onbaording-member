# Optional local Postgres for offline development.
# Production/staging uses Neon (set DATABASE_URL to your Neon connection string instead).
services:
  postgres:
    image: postgres:16-alpine
    container_name: mentor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD: mentor
      POSTGRES_DB: mentor_onboarding
    ports:
      - "5432:5432"
    volumes:
      - mentor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor -d mentor_onboarding"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mentor_pgdata:
